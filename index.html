<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT TKA FAUTMOLO - Versi 2.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f1f5f9; }
        .glass { background: white; border-radius: 16px; border: 1px solid #e2e8f0; }
        .hidden { display: none; }
        input, select, textarea { border: 1px solid #cbd5e1 !important; border-radius: 8px !important; padding: 10px !important; width: 100%; font-size: 14px; }
        .btn-primary { background: #2563eb; color: white; font-weight: bold; padding: 10px 20px; border-radius: 10px; transition: 0.3s; }
        .btn-primary:hover { background: #1d4ed8; transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen">

<div id="loginPage" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 p-4">
    <div class="glass p-8 w-full max-w-md shadow-2xl text-center">
        <h2 class="text-2xl font-bold text-blue-600 mb-6 uppercase">CBT TKA FAUTMOLO</h2>
        <div class="space-y-4 text-left">
            <input type="text" id="l_user" placeholder="Username / No. Peserta">
            <input type="password" id="l_pass" placeholder="Password">
            <button onclick="prosesLogin()" class="w-full btn-primary uppercase tracking-widest">Login</button>
        </div>
    </div>
</div>

<div id="mainApp" class="hidden">
    <nav class="bg-white border-b p-4 sticky top-0 z-40 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <span id="displaySekolah" class="font-bold text-blue-600">FAUTMOLO</span>
                <p id="userNama" class="text-[10px] text-slate-500 uppercase font-bold tracking-widest"></p>
            </div>
            <button onclick="location.reload()" class="bg-red-100 text-red-600 px-3 py-1 rounded text-xs font-bold uppercase">Logout</button>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4">
        
        <div id="superAdminSection" class="hidden space-y-6">
            <div class="glass p-6 border-l-4 border-orange-500">
                <h3 class="font-bold mb-4 text-sm uppercase">🔑 Daftar Proktor Sekolah</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="p_sekolah" placeholder="Nama Sekolah">
                    <input type="text" id="p_user" placeholder="ID Login">
                    <input type="text" id="p_pass" placeholder="Password">
                    <button onclick="tambahProktor()" class="btn-primary text-xs">Tambah Proktor</button>
                </div>
            </div>

            <div class="glass p-6 border-l-4 border-purple-500">
                <h3 class="font-bold mb-4 text-sm uppercase">📝 Bank Soal Kecamatan</h3>
                <div class="space-y-4">
                    <textarea id="q_tanya" placeholder="Pertanyaan Soal..."></textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="q_a" placeholder="Opsi A">
                        <input type="text" id="q_b" placeholder="Opsi B">
                        <input type="text" id="q_c" placeholder="Opsi C">
                        <input type="text" id="q_d" placeholder="Opsi D">
                    </div>
                    <select id="q_kunci">
                        <option value="">-- Pilih Kunci Jawaban --</option>
                        <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                    </select>
                    <button onclick="tambahSoal()" class="w-full bg-purple-600 text-white font-bold py-2 rounded-lg">SIMPAN SOAL</button>
                </div>
                <div class="mt-6 border-t pt-4">
                    <h4 class="text-xs font-bold mb-2">Total Soal: <span id="countSoal">0</span></h4>
                    <div id="listSoalAdmin" class="space-y-2 max-h-60 overflow-y-auto"></div>
                </div>
            </div>
        </div>

        <div id="proktorSection" class="hidden space-y-6">
            <div class="glass p-6 border-l-4 border-emerald-500">
                <h3 class="font-bold mb-4 text-sm uppercase">👥 Data Peserta Siswa</h3>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-3">
                    <input type="text" id="s_no" placeholder="No. Peserta">
                    <input type="text" id="s_nama" placeholder="Nama Siswa">
                    <input type="text" id="s_pass" placeholder="Pass Siswa">
                    <button onclick="tambahSiswa()" class="btn-primary text-xs">Tambah</button>
                </div>
                <div class="mt-6 overflow-x-auto">
                    <table class="w-full text-xs text-left">
                        <thead class="bg-slate-100 uppercase font-bold">
                            <tr><th class="p-2">No. Peserta</th><th class="p-2">Nama</th><th class="p-2">Hasil Ujian</th><th class="p-2">Aksi</th></tr>
                        </thead>
                        <tbody id="listSiswaTable"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="siswaSection" class="hidden">
            <div id="areaUjian" class="max-w-2xl mx-auto space-y-6">
                <div class="glass p-4 flex justify-between bg-blue-50">
                    <span class="text-xs font-bold uppercase">Siswa: <span id="namaSiswaUjian"></span></span>
                    <span class="text-xs font-bold text-blue-600 uppercase">WAKTU BERJALAN</span>
                </div>
                
                <div id="containerSoal">
                    </div>
            </div>
            
            <div id="areaSelesai" class="hidden text-center glass p-10 max-w-md mx-auto">
                <h2 class="text-3xl font-bold text-green-600 mb-2">SELESAI!</h2>
                <p class="text-slate-500 mb-6 uppercase text-xs font-bold tracking-widest">Nilai Kamu Telah Tersimpan</p>
                <div class="text-5xl font-black mb-6" id="skorAkhir">0</div>
                <button onclick="location.reload()" class="btn-primary w-full">Keluar</button>
            </div>
        </div>

    </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue, remove, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyA4_3IPW8BAWmBBSwYei4A7KE1AsLP9C-8",
    authDomain: "guru-rpgo.firebaseapp.com",
    databaseURL: "https://guru-rpgo-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "guru-rpgo",
    storageBucket: "guru-rpgo.firebasestorage.app",
    appId: "1:475490673231:web:a85fccf2eb86e9ace1c03a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let userLogin = null;
let databaseSoal = [];
let jawabanSiswa = {};

// LOGIN LOGIC
window.prosesLogin = async () => {
    const u = document.getElementById("l_user").value.toUpperCase();
    const p = document.getElementById("l_pass").value;

    if(u === 'AMADEO' && p === 'FAUTMOLO2026') {
        renderDashboard({ nama: "WENDELINUS CHRISTO SNAE, SE", role: "super_admin", sekolah: "KECAMATAN FAUTMOLO" });
        return;
    }

    const proktorSnap = await get(ref(db, "proktor_tka"));
    let pData = Object.values(proktorSnap.val() || {}).find(x => x.userID === u && x.password === p);
    if(pData) return renderDashboard({...pData, role: 'proktor'});

    const siswaSnap = await get(ref(db, "siswa_tka"));
    let sData = Object.values(siswaSnap.val() || {}).find(x => x.noPeserta === u && x.password === p);
    if(sData) return renderDashboard({...sData, role: 'siswa'});

    alert("Login Gagal!");
}

function renderDashboard(data) {
    userLogin = data;
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    document.getElementById("userNama").innerText = data.nama;
    document.getElementById("displaySekolah").innerText = data.sekolah;

    if(data.role === 'super_admin') {
        document.getElementById("superAdminSection").classList.remove("hidden");
        loadAdminData();
    } else if(data.role === 'proktor') {
        document.getElementById("proktorSection").classList.remove("hidden");
        loadProktorData();
    } else {
        document.getElementById("siswaSection").classList.remove("hidden");
        document.getElementById("namaSiswaUjian").innerText = data.nama;
        mulaiUjianSiswa();
    }
}

// BAPAK PUNYA KONTROL (SUPER ADMIN)
window.tambahProktor = () => {
    const s = document.getElementById("p_sekolah").value.toUpperCase();
    const u = document.getElementById("p_user").value.toUpperCase();
    const p = document.getElementById("p_pass").value;
    push(ref(db, "proktor_tka"), { sekolah: s, userID: u, password: p, nama: "PROKTOR " + s });
}

window.tambahSoal = () => {
    const soal = {
        tanya: document.getElementById("q_tanya").value,
        a: document.getElementById("q_a").value,
        b: document.getElementById("q_b").value,
        c: document.getElementById("q_c").value,
        d: document.getElementById("q_d").value,
        kunci: document.getElementById("q_kunci").value
    };
    push(ref(db, "bank_soal"), soal);
    alert("Soal Disimpan!");
}

function loadAdminData() {
    onValue(ref(db, "proktor_tka"), snap => {
        // Render tabel proktor (Bapak sudah bisa)
    });
    onValue(ref(db, "bank_soal"), snap => {
        let h = ""; let count = 0;
        Object.entries(snap.val() || {}).forEach(([key, q]) => {
            count++;
            h += `<div class="p-3 bg-slate-50 rounded border text-xs relative">
                <p class="font-bold">Q${count}: ${q.tanya}</p>
                <p class="text-blue-600">Kunci: ${q.kunci}</p>
                <button onclick="hapusData('bank_soal/${key}')" class="absolute top-2 right-2 text-red-500 font-bold">X</button>
            </div>`;
        });
        document.getElementById("countSoal").innerText = count;
        document.getElementById("listSoalAdmin").innerHTML = h;
    });
}

// PROKTOR DATA
window.tambahSiswa = () => {
    const s = {
        noPeserta: document.getElementById("s_no").value.toUpperCase(),
        nama: document.getElementById("s_nama").value.toUpperCase(),
        password: document.getElementById("s_pass").value,
        sekolah: userLogin.sekolah
    };
    push(ref(db, "siswa_tka"), s);
}

function loadProktorData() {
    onValue(ref(db, "siswa_tka"), snap => {
        let h = "";
        Object.entries(snap.val() || {}).forEach(([key, s]) => {
            if(s.sekolah === userLogin.sekolah) {
                h += `<tr class="border-b">
                    <td class="p-2">${s.noPeserta}</td>
                    <td class="p-2 font-bold">${s.nama}</td>
                    <td class="p-2 text-blue-600 font-bold">${s.nilai || 'BELUM UJIAN'}</td>
                    <td class="p-2"><button onclick="hapusData('siswa_tka/${key}')" class="text-red-500">Hapus</button></td>
                </tr>`;
            }
        });
        document.getElementById("listSiswaTable").innerHTML = h;
    });
}

// UJIAN SISWA LOGIC
async function mulaiUjianSiswa() {
    const snap = await get(ref(db, "bank_soal"));
    databaseSoal = Object.entries(snap.val() || {});
    renderSoalUjian(0);
}

function renderSoalUjian(index) {
    if(index >= databaseSoal.length) {
        selesaikanUjian();
        return;
    }

    const [id, q] = databaseSoal[index];
    const html = `
        <div class="glass p-6 shadow-lg animate-fade-in">
            <p class="text-xs font-bold text-slate-400 mb-2 uppercase">Pertanyaan ${index + 1} dari ${databaseSoal.length}</p>
            <p class="text-lg font-bold mb-6">${q.tanya}</p>
            <div class="space-y-3">
                ${['A','B','C','D'].map(opt => `
                    <button onclick="pilihJawaban('${id}', '${opt}', ${index})" class="w-full text-left p-4 rounded-xl border border-slate-200 hover:bg-blue-50 hover:border-blue-300 transition font-medium">
                        <span class="inline-block w-8 h-8 bg-slate-100 rounded text-center leading-8 mr-3 font-bold text-slate-600">${opt}</span>
                        ${q[opt.toLowerCase()]}
                    </button>
                `).join('')}
            </div>
        </div>
    `;
    document.getElementById("containerSoal").innerHTML = html;
}

window.pilihJawaban = (soalID, jaw, index) => {
    jawabanSiswa[soalID] = jaw;
    renderSoalUjian(index + 1);
}

async function selesaikanUjian() {
    let benar = 0;
    databaseSoal.forEach(([id, q]) => {
        if(jawabanSiswa[id] === q.kunci) benar++;
    });

    const skor = Math.round((benar / databaseSoal.length) * 100);
    
    // Simpan Nilai ke Firebase Siswa
    const siswaSnap = await get(ref(db, "siswa_tka"));
    Object.entries(siswaSnap.val()).forEach(([key, s]) => {
        if(s.noPeserta === userLogin.noPeserta) {
            set(ref(db, `siswa_tka/${key}/nilai`), skor);
        }
    });

    document.getElementById("areaUjian").classList.add("hidden");
    document.getElementById("areaSelesai").classList.remove("hidden");
    document.getElementById("skorAkhir").innerText = skor;
}

window.hapusData = (path) => confirm("Hapus data ini?") && remove(ref(db, path));
</script>
</body>
</html>
