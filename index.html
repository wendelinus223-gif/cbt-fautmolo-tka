<!doctype html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT TKA - RINGAN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f1f5f9; }
        .glass { background: white; border-radius: 12px; border: 1px solid #cbd5e1; }
        .hidden { display: none; }
        input, select, textarea { border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; width: 100%; margin-bottom: 10px; }
        .btn-blue { background: #1e40af; color: white; font-weight: bold; padding: 10px 20px; border-radius: 8px; width: 100%; }
        .btn-blue:hover { background: #1e3a8a; }
    </style>
</head>
<body>

<div id="loginPage" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900 p-4">
    <div class="bg-white p-8 rounded-2xl w-full max-w-sm shadow-xl text-center">
        <h1 class="text-2xl font-bold text-slate-800">CBT TKA</h1>
        <p class="text-blue-600 text-xs font-bold mb-6">KECAMATAN FAUTMOLO</p>
        <input type="text" id="l_user" placeholder="Username">
        <input type="password" id="l_pass" placeholder="Password">
        <button onclick="prosesLogin()" class="btn-blue">MASUK</button>
        <p class="text-[10px] mt-6 text-slate-400">BY WENDELINUS CHRISTO SNAE, SE</p>
    </div>
</div>

<div id="mainApp" class="hidden">
    <nav class="bg-white border-b p-4 sticky top-0 z-40 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-2">
            <div class="bg-blue-600 text-white w-8 h-8 rounded flex items-center justify-center font-bold">F</div>
            <span id="displaySekolah" class="font-bold text-slate-700 uppercase"></span>
        </div>
        <button onclick="location.reload()" class="text-red-600 font-bold text-xs">LOGOUT</button>
    </nav>

    <main class="max-w-6xl mx-auto p-4">
        <div id="superAdminSection" class="hidden space-y-6">
            <div class="glass p-6 border-l-4 border-blue-600">
                <p class="text-xs font-bold text-slate-500 mb-2">KONTROL SESI:</p>
                <select id="admin_set_sesi" onchange="updateSesiNasional(this.value)" class="font-bold">
                    <option value="NONAKTIF">-- MATIKAN UJIAN --</option>
                    <option value="LITERASI">HARI 1: LITERASI</option>
                    <option value="NUMERASI">HARI 2: NUMERASI</option>
                </select>
                <div class="mt-2 text-sm">Status: <span id="statusSesiSekarang" class="font-bold text-blue-600">-</span></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="glass p-6">
                    <h3 class="font-bold mb-4">🔑 PROKTOR</h3>
                    <input type="text" id="p_sekolah" placeholder="Sekolah">
                    <input type="text" id="p_user" placeholder="User Login">
                    <input type="text" id="p_pass" placeholder="Password">
                    <button onclick="tambahProktor()" class="btn-blue text-xs">DAFTARKAN PROKTOR</button>
                    <div id="listProktorTable" class="mt-4 text-xs"></div>
                </div>
                <div class="glass p-6">
                    <h3 class="font-bold mb-4">📝 BANK SOAL</h3>
                    <select id="q_kategori"><option value="LITERASI">LITERASI</option><option value="NUMERASI">NUMERASI</option></select>
                    <textarea id="q_tanya" placeholder="Soal..."></textarea>
                    <input type="text" id="q_a" placeholder="Opsi A">
                    <input type="text" id="q_b" placeholder="Opsi B">
                    <input type="text" id="q_c" placeholder="Opsi C">
                    <input type="text" id="q_d" placeholder="Opsi D">
                    <input type="text" id="q_kunci" placeholder="Kunci (A/B/C/D)">
                    <button onclick="tambahSoal()" class="btn-blue text-xs">SIMPAN SOAL</button>
                </div>
            </div>
        </div>

        <div id="proktorSection" class="hidden space-y-4">
            <div class="glass p-6">
                <h3 class="font-bold mb-4 uppercase text-sm">Input Data Siswa</h3>
                <div class="grid grid-cols-1 md:grid-cols-5 gap-2">
                    <input type="text" id="s_no" placeholder="No Peserta">
                    <input type="text" id="s_nama" placeholder="Nama">
                    <input type="text" id="s_pass" placeholder="Pass">
                    <input type="text" id="s_foto" placeholder="Link Foto">
                    <button onclick="tambahSiswa()" class="btn-blue h-[42px] text-xs">TAMBAH</button>
                </div>
            </div>
            <div class="glass overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-slate-100 font-bold uppercase">
                        <tr><th class="p-3">Siswa</th><th class="p-3">Status</th><th class="p-3">Nilai</th><th class="p-3 text-right">Aksi</th></tr>
                    </thead>
                    <tbody id="riwayatSkorTable" class="divide-y"></tbody>
                </table>
            </div>
        </div>

        <div id="siswaSection" class="hidden">
            <div id="areaTunggu" class="hidden text-center p-10 glass">
                <h2 class="text-xl font-bold">UJIAN BELUM AKTIF</h2>
            </div>
            <div id="areaUjian" class="max-w-2xl mx-auto">
                <div id="containerSoal"></div>
            </div>
            <div id="areaSelesai" class="hidden text-center p-10 glass">
                <h2 class="text-2xl font-bold">SELESAI</h2>
                <div class="text-5xl font-bold text-blue-600 my-4" id="skorAkhir">0</div>
                <button onclick="location.reload()" class="btn-blue">LOGOUT</button>
            </div>
        </div>
    </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, push, onValue, remove, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
    apiKey: "AIzaSyA4_3IPW8BAWmBBSwYei4A7KE1AsLP9C-8",
    authDomain: "guru-rpgo.firebaseapp.com",
    databaseURL: "https://guru-rpgo-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "guru-rpgo",
    appId: "1:475490673231:web:a85fccf2eb86e9ace1c03a"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let userLogin = null;
let sesiAktifNasional = "NONAKTIF";
let soalUjian = [];
let totalSkorBenar = 0;

window.prosesLogin = async () => {
    const u = document.getElementById("l_user").value.toUpperCase();
    const p = document.getElementById("l_pass").value;
    if(u==='AMADEO' && p==='FAUTMOLO2026') return renderDash({nama:"ADMIN",role:"super_admin",sekolah:"PUSAT"});
    const proS = await get(ref(db,"proktor_tka"));
    const pr = Object.values(proS.val()||{}).find(x=>x.userID===u && x.password===p);
    if(pr) return renderDash({...pr, role:'proktor'});
    const sisS = await get(ref(db,"siswa_tka"));
    const si = Object.entries(sisS.val()||{}).find(([k,v])=>v.noPeserta===u && v.password===p);
    if(si) return renderDash({...si[1], role:'siswa', dbId:si[0]});
    alert("Gagal Login!");
}

function renderDash(d) {
    userLogin = d;
    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("mainApp").classList.remove("hidden");
    document.getElementById("displaySekolah").innerText = d.sekolah;
    onValue(ref(db,"pengaturan_pusat/sesi_aktif"), s => {
        sesiAktifNasional = s.val() || "NONAKTIF";
        if(document.getElementById("statusSesiSekarang")) document.getElementById("statusSesiSekarang").innerText = sesiAktifNasional;
        if(d.role === 'siswa') cekSesi();
        if(d.role === 'proktor') loadSiswa();
    });
    if(d.role==='super_admin') { document.getElementById("superAdminSection").classList.remove("hidden"); loadProktor(); }
    else if(d.role==='proktor') { document.getElementById("proktorSection").classList.remove("hidden"); }
    else { document.getElementById("siswaSection").classList.remove("hidden"); }
}

window.cetakKartu = (nama, no, pass, foto) => {
    const w = window.open('', '_blank');
    w.document.write(`<html><body style="padding:20px; font-family:sans-serif;">
        <div style="width:300px; border:2px solid blue; padding:15px; border-radius:10px;">
            <center><h3>CBT TKA FAUTMOLO</h3></center><hr>
            <div style="display:flex; gap:10px;">
                <img src="${foto}" style="width:80px; height:100px; object-fit:cover; border:1px solid #ccc;">
                <div style="font-size:12px;">
                    <b>NO:</b> ${no}<br><b>NAMA:</b><br>${nama}<br><b>PASS:</b> ${pass}
                </div>
            </div>
            <button onclick="window.print()" style="margin-top:15px; width:100%;">PRINT</button>
        </div></body></html>`);
}

window.tambahSiswa = () => {
    const f = document.getElementById("s_foto").value;
    const data = {
        noPeserta: document.getElementById("s_no").value.toUpperCase(),
        nama: document.getElementById("s_nama").value.toUpperCase(),
        password: document.getElementById("s_pass").value,
        foto: f || "https://via.placeholder.com/150",
        sekolah: userLogin.sekolah,
        selesaiL: false, selesaiN: false, nilaiL: 0, nilaiN: 0
    };
    push(ref(db,"siswa_tka"), data).then(()=>{ alert("Selesai!"); loadSiswa(); });
}

function loadSiswa() {
    onValue(ref(db,"siswa_tka"), snap => {
        let h = "";
        Object.values(snap.val()||{}).forEach(s => {
            if(s.sekolah === userLogin.sekolah) {
                const nilai = sesiAktifNasional === "NUMERASI" ? (s.nilaiN||0) : (s.nilaiL||0);
                h += `<tr><td class="p-3"><b>${s.nama}</b><br>${s.noPeserta}</td>
                <td class="p-3">${sesiAktifNasional}</td><td class="p-3 font-bold text-blue-600">${nilai}</td>
                <td class="p-3 text-right"><button onclick="cetakKartu('${s.nama}','${s.noPeserta}','${s.password}','${s.foto}')" class="bg-blue-600 text-white px-2 py-1 rounded text-[10px]">CETAK</button></td></tr>`;
            }
        });
        document.getElementById("riwayatSkorTable").innerHTML = h;
    });
}

// DASAR UJIAN
async function cekSesi() {
    if(sesiAktifNasional === "NONAKTIF") document.getElementById("areaTunggu").classList.remove("hidden");
    else {
        const sAktif = await get(ref(db, `siswa_tka/${userLogin.dbId}`));
        const done = sesiAktifNasional === "LITERASI" ? sAktif.val().selesaiL : sAktif.val().selesaiN;
        if(done) tampilkanSkor(sesiAktifNasional === "LITERASI" ? sAktif.val().nilaiL : sAktif.val().nilaiN);
        else {
            document.getElementById("areaTunggu").classList.add("hidden");
            const bSoal = await get(ref(db,"bank_soal"));
            soalUjian = Object.values(bSoal.val()||{}).filter(x=>x.kategori===sesiAktifNasional);
            if(soalUjian.length>0) renderSoal(0);
        }
    }
}

function renderSoal(idx) {
    if(idx >= soalUjian.length) {
        const n = Math.round((totalSkorBenar/soalUjian.length)*100);
        const up = {};
        if(sesiAktifNasional==="LITERASI") { up.nilaiL = n; up.selesaiL = true; }
        else { up.nilaiN = n; up.selesaiN = true; }
        update(ref(db, `siswa_tka/${userLogin.dbId}`), up);
        tampilkanSkor(n); return;
    }
    const q = soalUjian[idx];
    document.getElementById("containerSoal").innerHTML = `<div class="glass p-6 mt-6">
        <p class="font-bold mb-4">${idx+1}. ${q.tanya}</p>
        ${['a','b','c','d'].map(o => `<label class="block p-3 border rounded-lg mb-2 cursor-pointer hover:bg-slate-50"><input type="radio" name="j" value="${o.toUpperCase()}"> ${o.toUpperCase()}. ${q[o]}</label>`).join('')}
        <button onclick="jawab(${idx},'${q.kunci}')" class="btn-blue mt-4">SIMPAN & LANJUT</button>
    </div>`;
}

window.jawab = (idx, k) => {
    const sel = document.querySelector('input[name="j"]:checked');
    if(!sel) return alert("Pilih satu!");
    if(sel.value === k.toUpperCase()) totalSkorBenar++;
    renderSoal(idx+1);
}

function tampilkanSkor(n) {
    document.getElementById("areaUjian").classList.add("hidden");
    document.getElementById("areaSelesai").classList.remove("hidden");
    document.getElementById("skorAkhir").innerText = n;
}

window.updateSesiNasional = (v) => set(ref(db,"pengaturan_pusat/sesi_aktif"), v).then(()=>alert("OK"));
window.tambahProktor = () => push(ref(db,"proktor_tka"), {sekolah:document.getElementById("p_sekolah").value, userID:document.getElementById("p_user").value, password:document.getElementById("p_pass").value}).then(()=>alert("OK"));
function loadProktor() {
    onValue(ref(db,"proktor_tka"), s => {
        let h = "";
        Object.values(s.val()||{}).forEach(p => h += `<div>${p.sekolah}</div>`);
        document.getElementById("listProktorTable").innerHTML = h;
    });
}
window.tambahSoal = () => push(ref(db,"bank_soal"), {kategori:document.getElementById("q_kategori").value, tanya:document.getElementById("q_tanya").value, a:document.getElementById("q_a").value, b:document.getElementById("q_b").value, c:document.getElementById("q_c").value, d:document.getElementById("q_d").value, kunci:document.getElementById("q_kunci").value}).then(()=>alert("OK"));
</script>
</body>
</html>
